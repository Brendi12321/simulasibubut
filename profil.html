    <style>
        /* [Sisipkan SELURUH CSS milik Anda di sini, persis sama] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f4fb; color: #1a2639; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background: #0b1a2e; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); border-bottom: 2px solid #2a4b6e; }
        .navbar .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 1.1rem; padding: 12px 0; }
        .navbar .logo i { color: #60a5fa; font-size: 1.4rem; }
        .navbar .logo span { color: #94b8d9; font-weight: 400; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 0; }
        .nav-links a { background: transparent; border: none; color: #b0c9e0; padding: 8px 16px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; text-decoration: none; }
        .nav-links a:hover { background: #1a334d; color: #fff; }
        .nav-links a.active { background: #2563eb; color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        @media (max-width: 780px) { .navbar { flex-direction: column; align-items: stretch; padding: 0 12px; } .nav-links { justify-content: center; padding-bottom: 10px; } .nav-links a { font-size: 0.7rem; padding: 6px 12px; } }
        @media (max-width: 500px) { .nav-links a { font-size: 0.6rem; padding: 4px 8px; } .nav-links a i { display: none; } }
        .main-content { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 30px 24px 40px; }
        .page-title { font-size: 1.8rem; font-weight: 800; color: #0b1a2e; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
        .page-title i { color: #2563eb; }
        .page-sub { color: #475569; margin-bottom: 28px; border-left: 4px solid #2563eb; padding-left: 16px; font-weight: 500; }
        footer { text-align: center; padding: 24px 0 10px; color: #94a3b8; font-size: 0.85rem; border-top: 1px solid #e2e8f0; margin-top: 20px; }
        #profil .profil-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        #profil .profil-card { background: #ffffff; border-radius: 24px; padding: 32px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04); border-top: 5px solid #2563eb; }
        #profil .profil-card.full { grid-column: 1 / -1; }
        #profil .profil-card .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #eef2f6; }
        #profil .profil-card .card-header i { font-size: 1.6rem; color: #2563eb; width: 44px; height: 44px; background: #eef2f6; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        #profil .profil-card .card-header h3 { font-size: 1.2rem; color: #0b1a2e; }
        #profil .profil-card .card-header .badge { background: #eef2f6; padding: 2px 14px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; color: #2563eb; margin-left: auto; }
        #profil .avatar-wrapper { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
        #profil .avatar-wrapper .avatar { width: 100px; height: 100px; background: linear-gradient(135deg, #0b1a2e, #2563eb); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3.2rem; color: #fff; flex-shrink: 0; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25); }
        #profil .avatar-wrapper .avatar-info h4 { font-size: 1.4rem; color: #0b1a2e; }
        #profil .avatar-wrapper .avatar-info p { color: #475569; font-size: 0.95rem; margin-top: 2px; }
        #profil .avatar-wrapper .avatar-info .tag { display: inline-block; background: #dbeafe; color: #2563eb; padding: 2px 14px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; margin-top: 6px; }
        #profil .detail-item { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid #f1f4f9; }
        #profil .detail-item:last-child { border-bottom: none; }
        #profil .detail-item i { width: 28px; color: #2563eb; font-size: 1.1rem; text-align: center; }
        #profil .detail-item .label { font-weight: 500; color: #475569; min-width: 120px; font-size: 0.9rem; }
        #profil .detail-item .value { color: #0b1a2e; font-weight: 600; font-size: 0.95rem; }
        #profil .petunjuk-list { list-style: none; padding: 0; }
        #profil .petunjuk-list li { display: flex; align-items: flex-start; gap: 14px; padding: 12px 0; border-bottom: 1px solid #f1f4f9; font-size: 0.95rem; color: #1a2639; line-height: 1.6; }
        #profil .petunjuk-list li:last-child { border-bottom: none; }
        #profil .petunjuk-list li .icon { font-size: 1.2rem; min-width: 32px; color: #2563eb; text-align: center; margin-top: 2px; }
        #profil .petunjuk-list li strong { color: #0b1a2e; }
        #profil .quote-box { background: linear-gradient(135deg, #f0f4fb, #e8edf5); border-radius: 16px; padding: 20px 24px; margin-top: 20px; border-left: 5px solid #2563eb; display: flex; align-items: flex-start; gap: 16px; }
        #profil .quote-box i { font-size: 2rem; color: #2563eb; opacity: 0.5; flex-shrink: 0; }
        #profil .quote-box p { font-style: italic; color: #1a2639; font-size: 0.95rem; line-height: 1.7; }
        #profil .quote-box .author { font-style: normal; font-weight: 600; color: #0b1a2e; margin-top: 4px; }
        #profil .tech-stack { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        #profil .tech-stack .tech { background: #eef2f6; padding: 6px 16px; border-radius: 30px; font-size: 0.8rem; font-weight: 500; color: #1a2639; display: flex; align-items: center; gap: 6px; }
        #profil .tech-stack .tech i { color: #2563eb; }
        @media (max-width: 850px) { #profil .profil-grid { grid-template-columns: 1fr; } #profil .profil-card.full { grid-column: 1; } }
        @media (max-width: 600px) { .page-title { font-size: 1.4rem; } #profil .profil-card { padding: 20px 16px; } #profil .avatar-wrapper { flex-direction: column; text-align: center; } #profil .detail-item { flex-wrap: wrap; gap: 4px; } #profil .detail-item .label { min-width: auto; font-size: 0.8rem; } #profil .detail-item .value { font-size: 0.85rem; } #profil .petunjuk-list li { font-size: 0.85rem; } #profil .quote-box { flex-direction: column; align-items: center; text-align: center; } }
