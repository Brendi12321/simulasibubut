<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Generator Ikon PWA — Bubut</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0;
         display:flex; flex-direction:column; align-items:center; padding:32px; gap:24px; }
  h1   { font-size:18px; font-weight:600; }
  .previews { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
  .previews figure { text-align:center; margin:0; }
  .previews canvas { display:block; border-radius:12px; box-shadow:0 6px 20px #0006; }
  figcaption { font-size:12px; color:#94a3b8; margin-top:8px; }
  button { padding:14px 32px; font-size:16px; font-weight:600; border:none; border-radius:10px;
           background:#60a5fa; color:#0b1a2e; cursor:pointer; transition:.15s; }
  button:hover { background:#3b82f6; transform:translateY(-1px); }
  p.note { font-size:12px; color:#64748b; max-width:480px; text-align:center; line-height:1.6; }
</style>
</head>
<body>

<h1>⚙️ Generator Ikon PWA — Bubut</h1>

<div class="previews">
  <figure><canvas id="c192" width="192" height="192"></canvas><figcaption>icon-192.png</figcaption></figure>
  <figure><canvas id="c512" width="512" height="512"></canvas><figcaption>icon-512.png</figcaption></figure>
  <figure><canvas id="cm"   width="512" height="512"></canvas><figcaption>icon-maskable.png</figcaption></figure>
</div>

<button id="dl">⬇ Download 3 Ikon</button>
<p class="note">File akan tersimpan ke folder <b>Downloads</b>.<br>
Setelah itu pindahkan ke folder <code>icons/</code> di root proyek.</p>

<script>
const BG = '#0b1a2e';
const FG = '#60a5fa';

/**
 * Gambar gear di canvas `ctx` berukuran `size × size`.
 * `scale` < 1 → konten mengecil di tengah (untuk maskable).
 */
function drawGear(ctx, size, scale = 1.0) {
  const SS = 4;                                  // supersample × 4
  const W  = size * SS;

  // kanvas offscreen resolusi tinggi
  const off = document.createElement('canvas');
  off.width = off.height = W;
  const c = off.getContext('2d');
  c.fillStyle = BG;
  c.fillRect(0, 0, W, W);

  const cx = W / 2, cy = W / 2;
  const R      = W * 0.35 * scale;               // radius badan gear
  const TEETH  = 8;
  const TOOTH_H = W * 0.07 * scale;              // tinggi gigi (radial)
  const TOOTH_W = W * 0.16 * scale;              // lebar gigi (tangensial)

  // --- gigi gear ---
  c.fillStyle = FG;
  for (let i = 0; i < TEETH; i++) {
    const a  = (2 * Math.PI * i) / TEETH;
    const tx = cx + (R + TOOTH_H / 2) * Math.cos(a);
    const ty = cy + (R + TOOTH_H / 2) * Math.sin(a);

    // 4 sudut gigi (dr = radial, dt = tangensial)
    const corners = [
      [-TOOTH_H / 2, -TOOTH_W / 2],
      [ TOOTH_H / 2, -TOOTH_W / 2],
      [ TOOTH_H / 2,  TOOTH_W / 2],
      [-TOOTH_H / 2,  TOOTH_W / 2],
    ];

    c.beginPath();
    corners.forEach(([dr, dt], k) => {
      const px = tx + dr * Math.cos(a) - dt * Math.sin(a);
      const py = ty + dr * Math.sin(a) + dt * Math.cos(a);
      k === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
    });
    c.closePath();
    c.fill();
  }

  // --- badan gear ---
  c.beginPath();
  c.arc(cx, cy, R, 0, 2 * Math.PI);
  c.fill();

  // --- lubang tengah ---
  c.fillStyle = BG;
  c.beginPath();
  c.arc(cx, cy, R * 0.45, 0, 2 * Math.PI);
  c.fill();

  // --- turunkan resolusi ke canvas target (anti-aliasing) ---
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.clearRect(0, 0, size, size);
  ctx.drawImage(off, 0, 0, W, W, 0, 0, size, size);
}

// ---- render pratinjau ----
drawGear(document.getElementById('c192').getContext('2d'), 192, 1.00);
drawGear(document.getElementById('c512').getContext('2d'), 512, 1.00);
drawGear(document.getElementById('cm').getContext('2d'),   512, 0.80);  // maskable: padding ±84px

// ---- unduh ----
function download(canvas, filename) {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href     = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

document.getElementById('dl').onclick = () => {
  download(document.getElementById('c192'), 'icon-192.png');
  setTimeout(() => download(document.getElementById('c512'), 'icon-512.png'), 400);
  setTimeout(() => download(document.getElementById('cm'),   'icon-maskable.png'), 800);
};
</script>
</body>
</html>
