<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Guru - Media Pembelajaran Mesin Bubut</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #f5f7fb;
    color: #1e293b;
}

.navbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    color: #2563eb;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.btn-logout {
    border: none;
    background: #ef4444;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.container {
    width: 90%;
    max-width: 1200px;
    margin: 35px auto;
}

.header {
    margin-bottom: 30px;
}

.header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.header p {
    color: #64748b;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.tab-btn {
    padding: 12px 20px;
    border: none;
    background: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    color: #64748b;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.tab-btn.active {
    background: #2563eb;
    color: white;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 10px;
    flex-wrap: wrap;
}

.card-header h2 {
    font-size: 21px;
}

.btn-primary {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-weight: 600;
    font-size: 14px;
}

input,
textarea,
select {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #dbe1e8;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #2563eb;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.btn-save {
    background: #16a34a;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.btn-cancel {
    background: #64748b;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
}

.item {
    border: 1px solid #e5e7eb;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 12px;
}

.item-title {
    font-weight: 700;
    margin-bottom: 8px;
}

.item-info {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 12px;
}

.item-actions {
    display: flex;
    gap: 8px;
}

.btn-edit {
    background: #f59e0b;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.btn-delete {
    background: #ef4444;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.badge {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 20px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 12px;
    margin-right: 5px;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #94a3b8;
}

.hidden {
    display: none !important;
}

.question-number {
    font-weight: 700;
    color: #2563eb;
    margin-bottom: 10px;
}

.options-box {
    display: grid;
    gap: 10px;
}

@media(max-width: 700px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .container {
        width: 94%;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">⚙️ Media Mesin Bubut</div>

    <div class="nav-right">
        <span id="guruEmail">Guru</span>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">

    <div class="header">
        <h1>Dashboard Guru</h1>
        <p>Kelola video pembelajaran dan soal evaluasi siswa.</p>
    </div>

    <div class="tabs">

        <button class="tab-btn active" onclick="showTab('video', this)">
            🎥 Video Pembelajaran
        </button>

        <button class="tab-btn" onclick="showTab('evaluasi', this)">
            📝 Evaluasi
        </button>

    </div>


    <!-- =========================
         VIDEO
    ========================== -->

    <section id="videoSection" class="section active">

        <div class="card">

            <div class="card-header">

                <h2>Kelola Video Pembelajaran</h2>

                <button class="btn-primary" onclick="showVideoForm()">
                    + Tambah Video
                </button>

            </div>

            <div id="videoForm" class="hidden">

                <div class="form-grid">

                    <div class="form-group full">
                        <label>Judul Video</label>
                        <input id="videoTitle" type="text"
                        placeholder="Contoh: Cara Kerja Mesin Bubut Konvensional">
                    </div>

                    <div class="form-group">
                        <label>YouTube ID</label>
                        <input id="videoEmbed" type="text"
                        placeholder="Contoh: gWUQwpr50qU">
                    </div>

                    <div class="form-group">
                        <label>Durasi</label>
                        <input id="videoDuration" type="text"
                        placeholder="Contoh: 12:34">
                    </div>

                    <div class="form-group">
                        <label>Level</label>

                        <select id="videoLevel">

                            <option value="dasar">
                                Dasar
                            </option>

                            <option value="menengah">
                                Menengah
                            </option>

                            <option value="lanjutan">
                                Lanjutan
                            </option>

                        </select>

                    </div>

                    <div class="form-group">
                        <label>Kategori</label>

                        <select id="videoCategory">

                            <option value="dasar">
                                Dasar
                            </option>

                            <option value="menengah">
                                Menengah
                            </option>

                            <option value="lanjutan">
                                Lanjutan
                            </option>

                            <option value="k3">
                                K3
                            </option>

                            <option value="cnc">
                                CNC
                            </option>

                        </select>

                    </div>

                    <div class="form-group full">

                        <label>Deskripsi</label>

                        <textarea
                            id="videoDescription"
                            placeholder="Deskripsi video..."></textarea>

                    </div>

                    <div class="form-group full">

                        <label>Tag</label>

                        <input
                            id="videoTags"
                            type="text"
                            placeholder="Contoh: Komponen, Dasar">

                    </div>

                </div>

                <div class="form-actions">

                    <button
                        class="btn-save"
                        onclick="saveVideo()">
                        Simpan Video
                    </button>

                    <button
                        class="btn-cancel"
                        onclick="cancelVideoForm()">
                        Batal
                    </button>

                </div>

            </div>

        </div>


        <div class="card">

            <div class="card-header">

                <h2>Daftar Video</h2>

            </div>

            <div id="videoList">

                <div class="empty">
                    Memuat video...
                </div>

            </div>

        </div>

    </section>



    <!-- =========================
         EVALUASI
    ========================== -->

    <section id="evaluasiSection" class="section">

        <div class="card">

            <div class="card-header">

                <h2>Kelola Soal Evaluasi</h2>

                <button
                    class="btn-primary"
                    onclick="showQuestionForm()">

                    + Tambah Soal

                </button>

            </div>


            <div id="questionForm" class="hidden">

                <div class="form-grid">

                    <div class="form-group full">

                        <label>Pertanyaan</label>

                        <textarea
                            id="questionText"
                            placeholder="Masukkan pertanyaan..."></textarea>

                    </div>


                    <div class="form-group">

                        <label>Opsi A</label>

                        <input
                            id="optionA"
                            type="text">

                    </div>


                    <div class="form-group">

                        <label>Opsi B</label>

                        <input
                            id="optionB"
                            type="text">

                    </div>


                    <div class="form-group">

                        <label>Opsi C</label>

                        <input
                            id="optionC"
                            type="text">

                    </div>


                    <div class="form-group">

                        <label>Opsi D</label>

                        <input
                            id="optionD"
                            type="text">

                    </div>


                    <div class="form-group">

                        <label>Jawaban Benar</label>

                        <select id="correctAnswer">

                            <option value="0">
                                A
                            </option>

                            <option value="1">
                                B
                            </option>

                            <option value="2">
                                C
                            </option>

                            <option value="3">
                                D
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        class="btn-save"
                        onclick="saveQuestion()">

                        Simpan Soal

                    </button>

                    <button
                        class="btn-cancel"
                        onclick="cancelQuestionForm()">

                        Batal

                    </button>

                </div>

            </div>

        </div>


        <div class="card">

            <div class="card-header">

                <h2>Daftar Soal Posttest</h2>

            </div>

            <div id="questionList">

                <div class="empty">
                    Memuat soal...
                </div>

            </div>

        </div>

    </section>

</div>


<script>

/* ======================================
   SUPABASE
====================================== */

const SUPABASE_URL =
    "https://fxsshzwljalwxpxpbjgn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "PASTE_PUBLISHABLE_KEY_KAMU_DI_SINI";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ======================================
   VARIABLE
====================================== */

let editingVideoId = null;
let editingQuestionId = null;


/* ======================================
   CEK LOGIN
====================================== */

async function checkLogin() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        window.location.href = "login.html";

        return;

    }

    document.getElementById("guruEmail").textContent =
        session.user.email;

    loadVideos();

    loadQuestions();
}


/* ======================================
   LOGOUT
====================================== */

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";

}


/* ======================================
   TAB
====================================== */

function showTab(tab, button) {

    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove("active");

        });


    document
        .querySelectorAll(".tab-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    if (tab === "video") {

        document
            .getElementById("videoSection")
            .classList.add("active");

    }


    if (tab === "evaluasi") {

        document
            .getElementById("evaluasiSection")
            .classList.add("active");

    }


    button.classList.add("active");

}


/* ======================================
   VIDEO
====================================== */

function showVideoForm() {

    document
        .getElementById("videoForm")
        .classList.remove("hidden");

}


function cancelVideoForm() {

    editingVideoId = null;

    document
        .getElementById("videoForm")
        .classList.add("hidden");

    clearVideoForm();

}


function clearVideoForm() {

    document.getElementById("videoTitle").value = "";
    document.getElementById("videoEmbed").value = "";
    document.getElementById("videoDuration").value = "";
    document.getElementById("videoLevel").value = "dasar";
    document.getElementById("videoCategory").value = "dasar";
    document.getElementById("videoDescription").value = "";
    document.getElementById("videoTags").value = "";

}


/* LOAD VIDEO */

async function loadVideos() {

    const container =
        document.getElementById("videoList");

    container.innerHTML =
        '<div class="empty">Memuat video...</div>';


    const { data, error } =
        await supabaseClient
            .from("videos")
            .select("*")
            .eq("active", true)
            .order("sort_order", {
                ascending: true
            });


    if (error) {

        console.error(error);

        container.innerHTML =
            '<div class="empty">Gagal memuat video.</div>';

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">Belum ada video.</div>';

        return;

    }


    container.innerHTML = data.map(video => `

        <div class="item">

            <div class="item-title">
                ${escapeHtml(video.title)}
            </div>

            <div class="item-info">

                <span class="badge">
                    ${escapeHtml(video.level)}
                </span>

                <span class="badge">
                    ${escapeHtml(video.category)}
                </span>

                Durasi: ${escapeHtml(video.duration || "-")}

            </div>

            <div class="item-actions">

                <button
                    class="btn-edit"
                    onclick='editVideo(${JSON.stringify(video)})'>

                    Edit

                </button>

                <button
                    class="btn-delete"
                    onclick="deleteVideo('${video.id}')">

                    Hapus

                </button>

            </div>

        </div>

    `).join("");

}


/* SAVE VIDEO */

async function saveVideo() {

    const title =
        document.getElementById("videoTitle").value.trim();

    const embed =
        document.getElementById("videoEmbed").value.trim();

    const duration =
        document.getElementById("videoDuration").value.trim();

    const level =
        document.getElementById("videoLevel").value;

    const category =
        document.getElementById("videoCategory").value;

    const description =
        document.getElementById("videoDescription").value.trim();

    const tagsText =
        document.getElementById("videoTags").value.trim();


    if (!title || !embed) {

        alert("Judul dan YouTube ID wajib diisi.");

        return;

    }


    const tags =
        tagsText
            ? tagsText
                .split(",")
                .map(tag => tag.trim())
                .filter(Boolean)
            : [];


    const videoData = {

        title,
        embed,
        duration,
        level,
        category,
        description,
        tags

    };


    let result;


    if (editingVideoId) {

        result =
            await supabaseClient
                .from("videos")
                .update(videoData)
                .eq("id", editingVideoId);

    } else {

        result =
            await supabaseClient
                .from("videos")
                .insert([videoData]);

    }


    if (result.error) {

        console.error(result.error);

        alert(
            "Gagal menyimpan video:\n" +
            result.error.message
        );

        return;

    }


    alert("Video berhasil disimpan.");

    editingVideoId = null;

    clearVideoForm();

    document
        .getElementById("videoForm")
        .classList.add("hidden");

    loadVideos();

}


/* EDIT VIDEO */

function editVideo(video) {

    editingVideoId = video.id;


    document.getElementById("videoTitle").value =
        video.title || "";

    document.getElementById("videoEmbed").value =
        video.embed || "";

    document.getElementById("videoDuration").value =
        video.duration || "";

    document.getElementById("videoLevel").value =
        video.level || "dasar";

    document.getElementById("videoCategory").value =
        video.category || "dasar";

    document.getElementById("videoDescription").value =
        video.description || "";

    document.getElementById("videoTags").value =
        Array.isArray(video.tags)
            ? video.tags.join(", ")
            : "";


    document
        .getElementById("videoForm")
        .classList.remove("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* DELETE VIDEO */

async function deleteVideo(id) {

    if (!confirm("Yakin ingin menghapus video ini?")) {

        return;

    }


    const { error } =
        await supabaseClient
            .from("videos")
            .update({
                active: false
            })
            .eq("id", id);


    if (error) {

        alert(
            "Gagal menghapus video:\n" +
            error.message
        );

        return;

    }


    alert("Video berhasil dihapus.");

    loadVideos();

}


/* ======================================
   EVALUASI
====================================== */

function showQuestionForm() {

    document
        .getElementById("questionForm")
        .classList.remove("hidden");

}


function cancelQuestionForm() {

    editingQuestionId = null;

    document
        .getElementById("questionForm")
        .classList.add("hidden");

    clearQuestionForm();

}


function clearQuestionForm() {

    document.getElementById("questionText").value = "";

    document.getElementById("optionA").value = "";

    document.getElementById("optionB").value = "";

    document.getElementById("optionC").value = "";

    document.getElementById("optionD").value = "";

    document.getElementById("correctAnswer").value = "0";

}


/* LOAD QUESTIONS */

async function loadQuestions() {

    const container =
        document.getElementById("questionList");

    container.innerHTML =
        '<div class="empty">Memuat soal...</div>';


    const { data, error } =
        await supabaseClient
            .from("posttest_questions")
            .select("*")
            .eq("active", true)
            .order("sort_order", {
                ascending: true
            });


    if (error) {

        console.error(error);

        container.innerHTML =
            '<div class="empty">Gagal memuat soal.</div>';

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">Belum ada soal.</div>';

        return;

    }


    container.innerHTML = data.map((question, index) => `

        <div class="item">

            <div class="question-number">
                Soal ${index + 1}
            </div>

            <div class="item-title">
                ${escapeHtml(question.question)}
            </div>

            <div class="item-info">

                A. ${escapeHtml(question.options?.[0] || "")}<br>
                B. ${escapeHtml(question.options?.[1] || "")}<br>
                C. ${escapeHtml(question.options?.[2] || "")}<br>
                D. ${escapeHtml(question.options?.[3] || "")}

                <br><br>

                <strong>
                    Jawaban benar:
                    ${["A", "B", "C", "D"][question.correct_answer]}
                </strong>

            </div>

            <div class="item-actions">

                <button
                    class="btn-edit"
                    onclick='editQuestion(${JSON.stringify(question)})'>

                    Edit

                </button>

                <button
                    class="btn-delete"
                    onclick="deleteQuestion('${question.id}')">

                    Hapus

                </button>

            </div>

        </div>

    `).join("");

}


/* SAVE QUESTION */

async function saveQuestion() {

    const question =
        document.getElementById("questionText")
            .value.trim();


    const options = [

        document.getElementById("optionA")
            .value.trim(),

        document.getElementById("optionB")
            .value.trim(),

        document.getElementById("optionC")
            .value.trim(),

        document.getElementById("optionD")
            .value.trim()

    ];


    const correctAnswer =
        parseInt(
            document.getElementById("correctAnswer").value
        );


    if (!question ||
        options.some(option => !option)) {

        alert(
            "Pertanyaan dan semua pilihan jawaban wajib diisi."
        );

        return;

    }


    const questionData = {

        question,

        options,

        correct_answer: correctAnswer

    };


    let result;


    if (editingQuestionId) {

        result =
            await supabaseClient
                .from("posttest_questions")
                .update(questionData)
                .eq("id", editingQuestionId);

    } else {

        result =
            await supabaseClient
                .from("posttest_questions")
                .insert([questionData]);

    }


    if (result.error) {

        console.error(result.error);

        alert(
            "Gagal menyimpan soal:\n" +
            result.error.message
        );

        return;

    }


    alert("Soal berhasil disimpan.");

    editingQuestionId = null;

    clearQuestionForm();

    document
        .getElementById("questionForm")
        .classList.add("hidden");

    loadQuestions();

}


/* EDIT QUESTION */

function editQuestion(question) {

    editingQuestionId = question.id;


    document.getElementById("questionText").value =
        question.question || "";


    const options =
        question.options || [];


    document.getElementById("optionA").value =
        options[0] || "";

    document.getElementById("optionB").value =
        options[1] || "";

    document.getElementById("optionC").value =
        options[2] || "";

    document.getElementById("optionD").value =
        options[3] || "";


    document.getElementById("correctAnswer").value =
        question.correct_answer ?? 0;


    document
        .getElementById("questionForm")
        .classList.remove("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* DELETE QUESTION */

async function deleteQuestion(id) {

    if (!confirm("Yakin ingin menghapus soal ini?")) {

        return;

    }


    const { error } =
        await supabaseClient
            .from("posttest_questions")
            .update({
                active: false
            })
            .eq("id", id);


    if (error) {

        alert(
            "Gagal menghapus soal:\n" +
            error.message
        );

        return;

    }


    alert("Soal berhasil dihapus.");

    loadQuestions();

}


/* ======================================
   SECURITY
====================================== */

function escapeHtml(text) {

    if (text === null || text === undefined) {

        return "";

    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ======================================
   START
====================================== */

checkLogin();

</script>

</body>
</html>
