<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi - Media Pembelajaran Mesin Bubut</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #f0f4fb;
            --text-color: #1a2639;
            --card-bg: #ffffff;
            --box-bg: #eef2f6;
            --navbar-bg: #0b1a2e;
            --nav-text: #b0c9e0;
            --nav-active: #2563eb;
            --footer-bg: #f0f4fb;
            --border-color: #e2e8f0;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --sub-text-color: #475569;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --warning: #f59e0b;
            --success: #16a34a;
            --danger: #dc2626;
        }

        body.dark-mode {
            --bg-color: #0a0f1a;
            --text-color: #e5e7eb;
            --card-bg: #1a2639;
            --box-bg: #1e293b;
            --navbar-bg: #101a28;
            --nav-text: #94b8d9;
            --nav-active: #3b82f6;
            --footer-bg: #0a0f1a;
            --border-color: #334155;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --sub-text-color: #94a3b8;
            --accent-light: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; transition: background-color 0.4s, color 0.4s; }

        /* NAVBAR */
        .navbar { background: var(--navbar-bg); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px var(--shadow-color); border-bottom: 2px solid #2a4b6e; transition: background-color 0.4s; }
        .navbar .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 1.1rem; padding: 12px 0; }
        .navbar .logo i { color: #60a5fa; font-size: 1.4rem; }
        .navbar .logo span { color: #94b8d9; font-weight: 400; }
        .dark-toggle { background: transparent; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; padding: 10px; transition: color 0.3s; }
        .dark-toggle:hover { color: #fbbf24; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 0; align-items: center; }
        .nav-links a { background: transparent; border: none; color: var(--nav-text); padding: 8px 16px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; text-decoration: none; }
        .nav-links a:hover { background: #1a334d; color: #fff; }
        .nav-links a.active { background: var(--nav-active); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .nav-links a.login-guru { background: rgba(37, 99, 235, 0.12); border: 1px solid rgba(96, 165, 250, 0.25); color: #93c5fd; }
        .nav-links a.login-guru:hover { background: #2563eb; color: white; }
        .nav-links a.dashboard-guru { background: #16a34a; color: white; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); }
        .nav-links a.dashboard-guru:hover { background: #15803d; }
        .nav-links button.btn-logout-siswa {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #fca5a5;
            padding: 8px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Inter', sans-serif;
            margin-left: 4px;
        }
        .nav-links button.btn-logout-siswa:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
        .nav-user-info {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(22, 163, 74, 0.15);
            border: 1px solid rgba(22, 163, 74, 0.3);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-left: 6px;
        }
        .nav-user-info i { font-size: 0.85rem; }
        @media (max-width: 900px) {
            .nav-user-info { font-size: 0.7rem; padding: 5px 10px; }
            .nav-links button.btn-logout-siswa { font-size: 0.7rem; padding: 6px 10px; }
        }
        @media (max-width: 780px) { .navbar { flex-direction: column; align-items: stretch; padding: 0 12px; } .nav-links { justify-content: center; padding-bottom: 10px; } .nav-links a { font-size: 0.7rem; padding: 6px 12px; } }
        @media (max-width: 500px) { .nav-links a { font-size: 0.6rem; padding: 4px 8px; } .nav-links a i { display: none; } .nav-links button.btn-logout-siswa i { display: inline; } }

        /* MAIN */
        .main-content { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 30px 24px 40px; }
        footer { text-align: center; padding: 24px 0 10px; color: #94a3b8; font-size: 0.85rem; border-top: 1px solid var(--border-color); margin-top: 20px; background: var(--footer-bg); transition: background-color 0.4s; }

        .page-title { font-size: 1.9rem; font-weight: 800; color: var(--text-color); margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
        .page-title i { color: var(--accent); }
        .page-sub { color: var(--sub-text-color); margin-bottom: 28px; border-left: 4px solid var(--accent); padding-left: 16px; font-weight: 500; }

        /* ACCORDION ITEM */
        .accordion-item {
            background: var(--card-bg);
            border-radius: 22px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px var(--shadow-color);
            border-left: 6px solid var(--accent);
            transition: background-color 0.4s, transform 0.25s, box-shadow 0.25s;
            overflow: hidden;
            scroll-margin-top: 90px;
        }
        .accordion-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow-color);
        }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 28px;
            cursor: pointer;
            user-select: none;
            gap: 16px;
            transition: background 0.2s;
        }
        .accordion-header:hover { background: var(--box-bg); }

        .accordion-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }
        .accordion-header h3 {
            font-size: 1.15rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-weight: 700;
            margin: 0;
        }
        .accordion-header h3 i { color: var(--accent); font-size: 1.1rem; }

        .accordion-arrow {
            color: var(--accent);
            font-size: 1rem;
            transition: transform 0.35s ease;
            flex-shrink: 0;
        }
        .accordion-item.open .accordion-arrow {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, padding 0.3s ease;
            padding: 0 28px;
        }
        .accordion-item.open .accordion-body {
            max-height: 8000px;
            padding: 0 28px 28px;
        }

        .accordion-body p { color: var(--sub-text-color); line-height: 1.85; font-size: 0.96rem; margin-bottom: 10px; }
        .accordion-body ul, .accordion-body ol { padding-left: 24px; color: var(--sub-text-color); line-height: 1.85; font-size: 0.94rem; margin-bottom: 10px; }
        .accordion-body ul li, .accordion-body ol li { margin-bottom: 6px; }
        .accordion-body ul li b, .accordion-body ol li b { color: var(--text-color); }
        .accordion-body .sub-heading { font-weight: 700; color: var(--accent); margin-top: 18px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 1rem; }

        /* TOPIC NUMBER */
        .topic-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px; height: 34px;
            background: var(--accent);
            color: #fff;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-right: 6px;
            flex-shrink: 0;
        }

        /* MATERI CONTENT FROM SUPABASE */
        .materi-content {
            color: var(--sub-text-color);
            line-height: 1.85;
            font-size: 0.96rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .materi-content p { margin-bottom: 10px; }

        .materi-objectives {
            background: var(--accent-light);
            border-left: 4px solid var(--accent);
            padding: 14px 18px;
            border-radius: 10px;
            margin: 14px 0;
            font-size: 0.9rem;
            color: var(--text-color);
            line-height: 1.7;
        }
        .materi-objectives strong { color: var(--accent); display: block; margin-bottom: 6px; }

        .badge-category {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            margin-left: 6px;
            text-transform: capitalize;
        }

        /* LOADING & EMPTY */
        .loading-box, .empty-box {
            text-align: center;
            padding: 60px 20px;
            color: var(--sub-text-color);
            background: var(--card-bg);
            border-radius: 22px;
            box-shadow: 0 4px 16px var(--shadow-color);
        }
        .loading-box i, .empty-box i {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 16px;
            display: block;
        }
        .empty-box i { color: #cbd5e1; }
        .loading-box p, .empty-box p { font-size: 0.95rem; }

        /* SCROLL TO TOP */
        #myBtn { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 99; border: none; outline: none; background-color: var(--nav-active); color: white; cursor: pointer; padding: 15px; border-radius: 10px; font-size: 18px; box-shadow: 0 4px 10px var(--shadow-color); transition: transform 0.3s; }
        #myBtn:hover { background-color: #1d4ed8; transform: translateY(-3px); }

        /* REVEAL */
        .reveal { opacity: 0; transform: translateY(30px); filter: blur(8px); transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease; }
        .reveal.is-visible { opacity: 1; transform: translateY(0); filter: blur(0); }
        .delay-1 { transition-delay: 0.1s; } .delay-2 { transition-delay: 0.2s; }
        .delay-3 { transition-delay: 0.3s; } .delay-4 { transition-delay: 0.4s; }
        .delay-5 { transition-delay: 0.5s; } .delay-6 { transition-delay: 0.6s; }
        .delay-7 { transition-delay: 0.7s; } .delay-8 { transition-delay: 0.8s; }
        .delay-9 { transition-delay: 0.9s; } .delay-10 { transition-delay: 1.0s; }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .accordion-header { padding: 18px 18px; }
            .accordion-body { padding: 0 18px; }
            .accordion-item.open .accordion-body { padding: 0 18px 22px; }
            .accordion-header h3 { font-size: 1rem; }
            .page-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-cogs"></i>
            <span>SMK N 5 Medan</span> · Bubut
        </div>
        <div style="display: flex; align-items: center;">
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-home"></i> Beranda</a>
                <a href="materi.html" class="active"><i class="fas fa-book"></i> Materi</a>
                <a href="video.html"><i class="fas fa-play-circle"></i> Video</a>
                <a href="simulasi.html"><i class="fas fa-cubes"></i> Simulasi</a>
                <a href="evaluasi.html"><i class="fas fa-clipboard-check"></i> Kuis</a>
                <a href="profil.html"><i class="fas fa-user-graduate"></i> Profil</a>

                <span id="navUserInfo" class="nav-user-info" style="display:none;">
                    <i class="fas fa-user"></i>
                    <span id="navUserText">-</span>
                </span>

                <button id="btnLogoutSiswa" class="btn-logout-siswa" style="display:none;" onclick="keluarSiswa()">
                    <i class="fas fa-right-from-bracket"></i> Keluar
                </button>

                <a href="#" id="guruModeBtn" class="login-guru" style="display:none;">
                    <i class="fas fa-user-tie"></i>
                    <span id="guruModeText">Login Guru</span>
                </a>
            </div>
            <button class="dark-toggle" id="darkModeToggle" title="Ganti Mode"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <div class="main-content">
        <div id="materi">
            <h2 class="page-title reveal"><i class="fas fa-book-open"></i> Materi Mesin Bubut</h2>
            <p class="page-sub reveal delay-1">Klik pada setiap topik untuk melihat penjelasannya. Materi diambil langsung dari database guru.</p>

            <!-- CONTAINER UNTUK MATERI DARI SUPABASE -->
            <div id="materiContainer">
                <div class="loading-box">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Memuat materi dari database...</p>
                </div>
            </div>
        </div>

        <footer>
            <i class="fas fa-copyright"></i> 2026 SMK Negeri 5 Medan – Media Pembelajaran Interaktif Mesin Bubut
        </footer>
    </div>

    <button id="myBtn" title="Kembali ke atas">↑</button>

    <script>
        /* =====================================================
           SUPABASE CONFIG
        ===================================================== */
        const SUPABASE_URL = "https://fxsshzwljalwxpxpbjgn.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NKOVw8rMBJ5SdPRmPihu8w_IKg9G_Tf";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        /* =====================================================
           ESCAPE HTML
        ===================================================== */
        function escapeHtml(text) {
            if (text === null || text === undefined) return "";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* =====================================================
           CEK IDENTITAS SISWA
        ===================================================== */
        function cekIdentitasSiswa() {
            const userMode = sessionStorage.getItem("userMode");
            const siswaNama = sessionStorage.getItem("siswaNama");
            const siswaKelas = sessionStorage.getItem("siswaKelas");

            const navUserInfo = document.getElementById("navUserInfo");
            const navUserText = document.getElementById("navUserText");
            const btnLogoutSiswa = document.getElementById("btnLogoutSiswa");
            const guruModeBtn = document.getElementById("guruModeBtn");
            const guruModeText = document.getElementById("guruModeText");

            if (userMode === "siswa" && siswaNama && siswaKelas) {
                navUserInfo.style.display = "inline-flex";
                navUserText.textContent = `${siswaNama} · ${siswaKelas}`;
                btnLogoutSiswa.style.display = "inline-flex";

                guruModeBtn.style.display = "inline-flex";
                guruModeBtn.className = "login-guru";
                guruModeBtn.href = "login.html";
                guruModeText.textContent = "Login Guru";
            } else if (userMode === "guru") {
                guruModeBtn.style.display = "inline-flex";
                supabaseClient.auth.getSession().then(({ data }) => {
                    if (data.session) {
                        guruModeBtn.className = "dashboard-guru";
                        guruModeBtn.href = "guru.html";
                        guruModeText.textContent = "Dashboard Guru";
                    } else {
                        guruModeBtn.className = "login-guru";
                        guruModeBtn.href = "login.html";
                        guruModeText.textContent = "Login Guru";
                    }
                });
            } else {
                // Belum login → tetap tampilkan Login Guru
                guruModeBtn.style.display = "inline-flex";
                guruModeBtn.className = "login-guru";
                guruModeBtn.href = "login.html";
                guruModeText.textContent = "Login Guru";
            }
        }

        /* =====================================================
           KELUAR SISWA
        ===================================================== */
        function keluarSiswa() {
            const nama = sessionStorage.getItem("siswaNama");
            if (!confirm(`Keluar dari akun "${nama}"?\n\nAnda akan kembali ke halaman login siswa.`)) {
                return;
            }
            sessionStorage.removeItem("userMode");
            sessionStorage.removeItem("siswaNama");
            sessionStorage.removeItem("siswaKelas");
            window.location.href = "index.html";
        }

        /* =====================================================
           LOAD MATERI DARI SUPABASE
        ===================================================== */
        async function loadMateriFromSupabase() {
            const container = document.getElementById("materiContainer");

            const { data, error } = await supabaseClient
                .from("materials")
                .select("*")
                .eq("active", true)
                .order("sort_order", { ascending: true });

            if (error) {
                console.error("Error load materi:", error);
                container.innerHTML = `
                    <div class="empty-box">
                        <i class="fas fa-triangle-exclamation" style="color:#dc2626;"></i>
                        <p>Gagal memuat materi dari database.</p>
                        <p style="font-size:0.8rem;margin-top:8px;color:#94a3b8;">
                            ${escapeHtml(error.message)}
                        </p>
                    </div>
                `;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-box">
                        <i class="fas fa-book-open"></i>
                        <p>Belum ada materi yang ditambahkan oleh guru.</p>
                        <p style="font-size:0.8rem;margin-top:8px;color:#94a3b8;">
                            Silakan tambahkan materi melalui Dashboard Guru.
                        </p>
                    </div>
                `;
                return;
            }

            container.innerHTML = data.map((materi, index) => `
                <div class="accordion-item reveal" id="materi-${materi.id}">
                    <div class="accordion-header" data-toggle="accordion">
                        <div class="accordion-header-left">
                            <h3>
                                <span class="topic-num">${index + 1}</span>
                                <i class="fas fa-bookmark"></i>
                                ${escapeHtml(materi.title)}
                                <span class="badge-category">${escapeHtml(materi.category || "umum")}</span>
                            </h3>
                        </div>
                        <i class="fas fa-chevron-down accordion-arrow"></i>
                    </div>
                    <div class="accordion-body">
                        ${materi.description ? `<p><strong>${escapeHtml(materi.description)}</strong></p>` : ""}
                        ${materi.objectives ? `
                            <div class="materi-objectives">
                                <strong><i class="fas fa-bullseye"></i> Tujuan Pembelajaran:</strong>
                                ${escapeHtml(materi.objectives)}
                            </div>
                        ` : ""}
                        <div class="materi-content">${escapeHtml(materi.content || "Belum ada isi materi.")}</div>
                    </div>
                </div>
            `).join("");

            initAccordion();
            initReveal();
        }

        /* =====================================================
           ACCORDION
        ===================================================== */
        function initAccordion() {
            document.querySelectorAll('[data-toggle="accordion"]').forEach(header => {
                header.addEventListener('click', function() {
                    const item = this.closest('.accordion-item');
                    document.querySelectorAll('.accordion-item.open').forEach(openItem => {
                        if (openItem !== item) openItem.classList.remove('open');
                    });
                    item.classList.toggle('open');
                });
            });
        }

        /* =====================================================
           REVEAL ANIMATION
        ===================================================== */
        function initReveal() {
            const observerOptions = { threshold: 0.05, rootMargin: "0px 0px -50px 0px" };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    } else {
                        entry.target.classList.remove('is-visible');
                    }
                });
            }, observerOptions);
            document.querySelectorAll('.reveal').forEach(el => { observer.observe(el); });
        }

        /* =====================================================
           TOMBOL KEMBALI KE ATAS
        ===================================================== */
        const mybutton = document.getElementById("myBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                mybutton.style.display = "block";
            } else {
                mybutton.style.display = "none";
            }
        };
        mybutton.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };

        /* =====================================================
           DARK MODE
        ===================================================== */
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkModeIcon = darkModeToggle.querySelector('i');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            darkModeIcon.classList.remove('fa-moon');
            darkModeIcon.classList.add('fa-sun');
        }
        darkModeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            let theme = 'light';
            if (document.body.classList.contains('dark-mode')) {
                theme = 'dark';
                darkModeIcon.classList.remove('fa-moon');
                darkModeIcon.classList.add('fa-sun');
            } else {
                darkModeIcon.classList.remove('fa-sun');
                darkModeIcon.classList.add('fa-moon');
            }
            localStorage.setItem('theme', theme);
        });

        /* =====================================================
           MENANDAI MENU AKTIF
        ===================================================== */
        document.addEventListener("DOMContentLoaded", function() {
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            document.querySelectorAll(".nav-links a").forEach(link => {
                const linkPath = link.getAttribute("href");
                if (link.id === "guruModeBtn") return;
                if (linkPath === currentPath) link.classList.add("active");
                else link.classList.remove("active");
            });
        });

        /* =====================================================
           START
        ===================================================== */
        cekIdentitasSiswa();
        loadMateriFromSupabase();

        console.log('✅ Materi dinamis dari Supabase siap!');
    </script>

</body>
</html>
